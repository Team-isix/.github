<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- main gradient: dark to gold tones like JinroOn's pink gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#2A2318"/>
      <stop offset="35%" stop-color="#17171B"/>
      <stop offset="70%" stop-color="#0D0D0F"/>
      <stop offset="100%" stop-color="#1F1A12"/>
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A96A" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#E3C88F" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C9A96A" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A96A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A8894E" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A8894E"/>
      <stop offset="50%" stop-color="#E3C88F"/>
      <stop offset="100%" stop-color="#C9A96A"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>

  <!-- wave layer 1 (back) -->
  <path d="M0,240 C200,200 400,280 600,250 C800,220 1000,270 1200,230 L1200,320 L0,320 Z" fill="url(#waveGrad2)"/>

  <!-- wave layer 2 (front) -->
  <path d="M0,270 C250,300 450,240 700,275 C900,300 1050,260 1200,285 L1200,320 L0,320 Z" fill="url(#waveGrad1)"/>

  <!-- title -->
  <text x="600" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="bold" letter-spacing="20" fill="url(#goldText)" text-anchor="middle">CLOSER</text>

  <!-- subtitle -->
  <text x="600" y="205" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="20" font-weight="300" letter-spacing="2" fill="#F2EFE9" opacity="0.9" text-anchor="middle">가장 완벽한 명품을 가장 가까이, 내 몸 위의 3D 가상 아틀리에</text>
</svg>
